<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="电脑管家">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<title>电脑管家</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3441;
    --fg:#e6edf3; --dim:#8b949e; --accent:#4c8dff; --ok:#3fb950;
    --warn:#d29922; --err:#f85149; --me:#1f6feb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky;top:0;z-index:20;background:rgba(22,27,34,.94);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:10px 14px;display:flex;align-items:center;gap:10px;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.busy{background:var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  header .meta{margin-left:auto;font-size:11px;color:var(--dim);text-align:right;line-height:1.3;max-width:45%;min-width:0;overflow:hidden}
  #stop{
    background:linear-gradient(180deg,#f85149,#c9302c);color:#fff;border:0;
    border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700;flex:none;
  }
  #stop:active{transform:scale(.95)}

  #log{flex:1;overflow-y:auto;padding:14px 12px 8px;scroll-behavior:smooth}
  .row{display:flex;margin-bottom:10px;animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .row.me{justify-content:flex-end}
  .bubble{
    max-width:86%;min-width:0;padding:9px 13px;border-radius:14px;background:var(--panel);
    border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;
  }
  .row{min-width:0}
  .row.me .bubble{background:var(--me);border-color:#2d7ff9;border-bottom-right-radius:4px}
  .row.sys .bubble{background:transparent;border:0;color:var(--dim);font-size:12.5px;padding:2px 4px}
  .bubble img{max-width:100%;border-radius:9px;margin-top:6px;display:block}
  .bubble .tag{font-size:11px;color:var(--dim);margin-bottom:3px}

  .tool{font-size:12.5px;color:var(--dim);background:var(--panel2);
    border-left:3px solid var(--accent);border-radius:6px;padding:6px 10px;margin-bottom:7px;
    font-family:ui-monospace,Consolas,monospace;word-break:break-all;white-space:pre-wrap}
  .tool.bad{border-left-color:var(--err)}
  .tool.good{border-left-color:var(--ok)}
  .tool .fn{color:#79c0ff;font-weight:600}

  .step{font-size:11.5px;color:#6e7681;margin:4px 2px 6px}
  .spin{display:inline-block;width:9px;height:9px;border:2px solid var(--dim);
    border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}

  #previews{display:flex;gap:8px;padding:0 12px 8px;overflow-x:auto}
  .pv{position:relative;flex:none}
  .pv img{width:62px;height:62px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
  .pv b{position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;
    width:19px;height:19px;border-radius:50%;font-size:12px;line-height:19px;text-align:center;font-weight:400}

  footer{
    position:sticky;bottom:0;background:rgba(22,27,34,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:9px 10px;
    padding-bottom:calc(9px + env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:flex-end;
  }
  #cam{
    width:44px;height:44px;flex:none;border-radius:12px;background:var(--panel2);
    border:1px solid var(--line);color:var(--fg);font-size:20px;display:flex;
    align-items:center;justify-content:center;
  }
  #cam:active{background:#2a3441}
  #text{
    flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:11px 12px;font:15px/1.4 inherit;resize:none;
    max-height:120px;min-height:44px;outline:none;
  }
  #text:focus{border-color:var(--accent)}
  #send{
    width:44px;height:44px;flex:none;border-radius:12px;border:0;
    background:var(--accent);color:#fff;font-size:19px;font-weight:700;
  }
  #send:disabled{opacity:.4}
  #send:active{transform:scale(.94)}

  #confirm{
    position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;
    display:none;align-items:center;justify-content:center;padding:22px;
  }
  #confirm.show{display:flex}
  .card{background:var(--panel);border:1px solid var(--warn);border-radius:16px;
    padding:18px;width:100%;max-width:390px}
  .card h3{margin:0 0 8px;font-size:17px;color:var(--warn)}
  .card .detail{background:var(--panel2);border-radius:9px;padding:10px;
    font:13px/1.5 ui-monospace,Consolas,monospace;word-break:break-all;
    max-height:35vh;overflow:auto;margin-bottom:14px;white-space:pre-wrap}
  .card .btns{display:flex;gap:10px}
  .card button{flex:1;padding:12px;border-radius:11px;border:0;font-size:15px;font-weight:600}
  .no{background:var(--panel2);color:var(--fg);border:1px solid var(--line)!important}
  .yes{background:var(--err);color:#fff}
  .hint{text-align:center;color:var(--dim);font-size:11px;margin-top:8px}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    background:#30363d;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:120;max-width:84%;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>电脑管家</h1>
  <div class="meta" id="meta">连接中…</div>
  <button id="stop">急停</button>
</header>

<div id="log">
  <div class="row sys"><div class="bubble">连上后会显示电脑状态。直接说话，或者拍张照发过来。</div></div>
</div>

<div id="previews"></div>

<footer>
  <button id="cam">📷</button>
  <textarea id="text" rows="1" placeholder="让电脑做点什么…"></textarea>
  <button id="send">↑</button>
</footer>

<input type="file" id="file" accept="image/*" multiple hidden>

<div id="confirm"><div class="card">
  <h3>⚠ 这个操作要先确认</h3>
  <div class="detail" id="cDetail"></div>
  <div class="btns">
    <button class="no" id="cNo">拒绝</button>
    <button class="yes" id="cYes">允许执行</button>
  </div>
  <div class="hint" id="cHint"></div>
</div></div>

<div id="toast"></div>

<script>
const TOKEN = (new URLSearchParams(location.search).get('t')
  || (document.cookie.match(/(?:^|;\s*)pcbuddy_token=([^;]+)/) || [])[1]
  || '');
const $ = s => document.querySelector(s);
const logEl = $('#log'), textEl = $('#text'), sendBtn = $('#send');
let images = [], since = 0, busy = false, confirmTimer = null;

const api = (p, opt) => fetch(p + (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(TOKEN), opt);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function toast(msg, ms = 2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function atBottom(){ return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 120; }
function scroll(force){
  if (force || atBottom()) requestAnimationFrame(() => logEl.scrollTop = logEl.scrollHeight);
}
function addRow(html, cls){
  const stick = atBottom();
  const d = document.createElement('div');
  d.className = 'row ' + (cls || '');
  d.innerHTML = '<div class="bubble">' + html + '</div>';
  logEl.appendChild(d);
  scroll(stick);
  return d;
}
function setBusy(b){
  busy = b;
  const dot = $('#dot');
  dot.className = 'dot on' + (b ? ' busy' : '');
  sendBtn.disabled = b;
  $('#meta').innerHTML = b ? '正在干活…' : ($('#meta').dataset.idle || '');
}

/* ---------- 事件渲染 ---------- */
function render(ev){
  since = Math.max(since, ev.seq || 0);
  switch(ev.type){
    case 'task_start': {
      let h = '<div class="tag">你</div>' + (esc(ev.text) || '（图片）');
      (ev.images || []).forEach(u => h += '<img src="' + u + '?t=' + encodeURIComponent(TOKEN) + '">');
      addRow(h, 'me');
      setBusy(true);
      break;
    }
    case 'step':
      addRow('<span class="spin"></span> ' + esc(ev.text), 'sys');
      break;
    case 'action':
      addRow('<div class="tool"><span class="fn">' + esc(ev.name) + '</span>  ' + esc(ev.detail) + '</div>', 'sys');
      break;
    case 'result':
      addRow('<div class="tool ' + (ev.ok ? 'good' : 'bad') + '">↳ ' + esc(ev.brief) + '</div>', 'sys');
      break;
    case 'image':
      addRow('<img src="' + ev.url + '?t=' + encodeURIComponent(TOKEN) + '">', 'sys');
      break;
    case 'warn':
      addRow('⚠ ' + esc(ev.text), 'sys');
      break;
    case 'final':
      addRow(esc(ev.text));
      break;
    case 'task_end':
      setBusy(false);
      if(!ev.ok) addRow('✕ ' + esc(ev.text), 'sys');
      else addRow('<span style="color:#8b949e">— 用时 ' + ev.elapsed + ' 秒 —</span>', 'sys');
      break;
    case 'confirm_request':
      showConfirm(ev);
      break;
    case 'confirm_done':
      hideConfirm();
      toast(ev.allow ? '已允许' : '已拒绝：' + ev.reason);
      break;
  }
}
function showConfirm(ev){
  $('#cDetail').textContent = ev.detail || '';
  $('#confirm').classList.add('show');
  let left = ev.timeout || 120;
  $('#cHint').textContent = '不操作的话 ' + left + ' 秒后自动拒绝';
  clearInterval(confirmTimer);
  confirmTimer = setInterval(() => {
    left--;
    $('#cHint').textContent = left > 0 ? ('不操作的话 ' + left + ' 秒后自动拒绝') : '已超时';
    if(left <= 0) clearInterval(confirmTimer);
  }, 1000);
  $('#cYes').onclick = () => answer(ev.id, true);
  $('#cNo').onclick = () => answer(ev.id, false);
}
function hideConfirm(){ clearInterval(confirmTimer); $('#confirm').classList.remove('show'); }
function answer(id, allow){
  api('/api/confirm', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id, allow})}).catch(() => {});
  hideConfirm();
}

/* ---------- SSE ---------- */
function connect(){
  const es = new EventSource('/api/events?since=' + since + '&t=' + encodeURIComponent(TOKEN));
  es.onopen = () => { $('#dot').classList.add('on'); };
  es.onmessage = e => { try { render(JSON.parse(e.data)); } catch(_){} };
  es.onerror = () => {
    $('#dot').className = 'dot';
    $('#meta').textContent = '断线了，重连中…';
    es.close();
    setTimeout(connect, 1500);
  };
}

/* ---------- 图片 ---------- */
$('#cam').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  for(const f of Array.from(e.target.files || [])){
    const d = await shrink(f);
    if(d) images.push({name: f.name || 'photo.jpg', data: d});
  }
  e.target.value = '';
  drawPreviews();
};
function shrink(file){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let {width:w, height:h} = img;
        if(Math.max(w,h) > MAX){ const k = MAX / Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => res(null);
      img.src = fr.result;
    };
    fr.onerror = () => res(null);
    fr.readAsDataURL(file);
  });
}
function drawPreviews(){
  const box = $('#previews');
  box.innerHTML = '';
  images.forEach((im, i) => {
    const d = document.createElement('div'); d.className = 'pv';
    d.innerHTML = '<img src="' + im.data + '"><b>×</b>';
    d.querySelector('b').onclick = () => { images.splice(i,1); drawPreviews(); };
    box.appendChild(d);
  });
}

/* ---------- 发送 ---------- */
async function send(){
  const t = textEl.value.trim();
  if(!t && !images.length) return;
  if(busy){ toast('上一件事还在做，先等等'); return; }
  const payload = {text: t, images: images.slice()};
  textEl.value = ''; textEl.style.height = 'auto';
  images = []; drawPreviews();
  try{
    const r = await api('/api/send', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)});
    const j = await r.json();
    if(!j.ok) toast(j.error || '发送失败');
  }catch(e){ toast('发不出去，检查是不是断网了'); }
}
sendBtn.onclick = send;
textEl.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
textEl.oninput = () => { textEl.style.height = 'auto'; textEl.style.height = Math.min(textEl.scrollHeight, 120) + 'px'; };
$('#stop').onclick = async () => {
  if(!confirm('确定要急停吗？')) return;
  await api('/api/stop', {method:'POST'});
  toast('已急停');
};

/* ---------- 启动 ---------- */
(async function init(){
  try{
    const j = await (await api('/api/info')).json();
    $('#meta').dataset.idle = j.model + ' · ' + (j.has_key ? '就绪' : '缺 Key');
    $('#meta').textContent = $('#meta').dataset.idle;
    if(!j.has_key){
      addRow('⚠ 电脑上还没填 DeepSeek API Key，我先能听不能想。让电脑那边打开 <b>config.json</b> 填上 <b>api_key</b> 再重启。', 'sys');
    }
    setBusy(false);
  }catch(e){}
  connect();
})();
</script>
</body>
</html>
