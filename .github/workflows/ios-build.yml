# 没有 Mac？用 GitHub 的 macOS 机器帮你编译出未签名 .ipa。
#
# 用法：
#   1. 把 pc-buddy 整个目录传到一个 GitHub 仓库（公开仓库免费）
#   2. 仓库页 → Actions → 左侧选 "Build iOS app" → Run workflow
#   3. 跑完在 Artifacts 里下载 PCBuddy-unsigned-ipa
#   4. 用 AltStore / Sideloadly 拿你自己的 Apple ID 签名后装进 iPhone
#
# 注意：这个产物没有签名，不能直接拖进 iPhone，必须用签名工具再过一道。

name: Build iOS app

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PCBuddy.xcodeproj \
            -scheme PCBuddy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: 打包成 ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PCBuddy.app Payload/
          zip -qry PCBuddy-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PCBuddy-unsigned-ipa
          path: ios/PCBuddy-unsigned.ipa
          if-no-files-found: error
