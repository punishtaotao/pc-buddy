# 没有 Mac？用 GitHub 的 macOS 机器帮你编译出未签名 .ipa。
#
# 用法：
#   1. 把 pc-buddy 整个目录传到一个 GitHub 仓库（公开仓库免费）
#   2. 仓库页 → Actions → 左侧选 "Build iOS app" → Run workflow
#   3. 跑完在 Artifacts 里下载 PCBuddy-unsigned-ipa
#   4. 用 AltStore / Sideloadly 拿你自己的 Apple ID 签名后装进 iPhone
#
# 注意：这个产物没有签名，不能直接拖进 iPhone，必须用签名工具再过一道。

name: Build iOS app

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ios
        run: |
          xcodegen generate
          echo "--- 生成的工程格式 ---"
          grep -m1 'objectVersion' PCBuddy.xcodeproj/project.pbxproj || true
          # 兜底：万一 xcodegen 太旧、project.yml 里的 projectFormat 没生效，
          # 手动把工程格式降到 Xcode 15 能读的版本，否则必报
          # "future Xcode project file format"。
          OBJ=$(grep -m1 -oE 'objectVersion = [0-9]+' PCBuddy.xcodeproj/project.pbxproj | grep -oE '[0-9]+' | head -1)
          if [ -n "$OBJ" ] && [ "$OBJ" -gt 70 ]; then
            echo "objectVersion=$OBJ 对 Xcode 15 过高，降级到 60"
            sed -i.bak -E 's|objectVersion = [0-9]+|objectVersion = 60|' PCBuddy.xcodeproj/project.pbxproj
            grep -m1 'objectVersion' PCBuddy.xcodeproj/project.pbxproj
          fi

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PCBuddy.xcodeproj \
            -scheme PCBuddy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: 打包成 ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PCBuddy.app Payload/
          zip -qry PCBuddy-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PCBuddy-unsigned-ipa
          path: ios/PCBuddy-unsigned.ipa
          if-no-files-found: error
